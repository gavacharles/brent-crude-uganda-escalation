name: Rerun Brent calibration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *" # monthly on day 1 at 05:00 UTC

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn matplotlib

      - name: Run calibration round 3
        run: |
          python analysis/calibrate_round3.py

      - name: Upload round 3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brent-calibration-round3
          path: |
            results/round3

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/round3
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated calibration rerun"
            git push
          else
            echo "No output changes to commit"
          fi
